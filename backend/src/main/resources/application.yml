server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: fresh-mall
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/fresh_mall?serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:fresh_mall}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 12
      minimum-idle: 2
      transaction-isolation: TRANSACTION_READ_COMMITTED
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 7MB
mybatis:
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true
    local-cache-scope: STATEMENT
app:
  brand-name: ${APP_BRAND_NAME:fresh-mall}
  token-secret: ${APP_TOKEN_SECRET:}
  access-ttl-seconds: 900
  refresh-ttl-seconds: 604800
  csrf-ttl-seconds: 600
  secure-cookies: ${APP_SECURE_COOKIES:true}
  allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:5173}
  public-origin: ${APP_PUBLIC_ORIGIN:http://localhost:8080}
  media-dir: ${APP_MEDIA_DIR:./.runtime/media}
  near-expiry-days: 3
  near-expiry-discount-basis-points: 9000
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
logging:
  level:
    root: INFO
    com.freshmart: INFO
