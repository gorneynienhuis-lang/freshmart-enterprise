<article class="r4-product-card">
  <a class="r4-product-media" href="#"><img src="{{p.img}}" alt="{{p.name}}" loading="lazy" width="280" height="280"><sc-if value="{{p.near}}"><span class="r4-product-near">{{p.near}}</span></sc-if></a>
  <div class="r4-product-body"><div class="r4-product-tags"><span>{{p.store}}</span><sc-if value="{{p.weighed}}"><span>称重</span></sc-if></div><a class="r4-product-name" href="#">{{p.name}}</a><p class="r4-product-meta">{{p.spec}}</p><div class="r4-product-pricing"><strong class="r4-price">¥{{p.price}}</strong><del>¥{{p.ref}}</del></div><p class="r4-product-unit">{{p.unit}}</p><div class="r4-product-actions"><button type="button" aria-label="加入购物车">加入购物车 <span aria-hidden="true">＋</span></button></div></div>
</article>
