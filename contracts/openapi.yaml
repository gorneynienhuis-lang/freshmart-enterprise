{
  "openapi": "3.1.0",
  "jsonSchemaDialect": "https://json-schema.org/draft/2020-12/schema",
  "info": {
    "title": "fresh-mall 企业级生鲜商城接口契约",
    "version": "0.1.2",
    "description": "2026-10-18课程生鲜商城接口契约；以各operation的x-implementation-status区分已实现与尚未实现，示例不代表验收结果。BASELINE.md规定业务基线，CNY整数分、整数克、字符串ID，业务时区Asia/Shanghai。JSON语法为YAML1.2子集。v0.1.2新增员工治理五操作实装标记与独立showcase部署环境，业务状态和已有请求/响应结构不变。IMPLEMENTED_DEMO表示存在真实数据库实现，运行与部署验收以docs/evidence为准；showcase始终为合成数据和沙箱支付。"
  },
  "servers": [
    {
      "url": "http://localhost:8080",
      "description": "本机真实后端；公网showcase使用部署分配的同源HTTPS地址"
    }
  ],
  "tags": [
    {
      "name": "auth",
      "description": "会话与CSRF"
    },
    {
      "name": "admin",
      "description": "后台最小演示契约；岗位/数据范围/职责分离由服务端执行"
    }
  ],
  "paths": {
    "/api/v1/auth/csrf": {
      "get": {
        "operationId": "getCsrfToken",
        "tags": [
          "auth"
        ],
        "summary": "获取Cookie变更保护令牌",
        "description": "获取Cookie变更保护令牌\n\n所有写操作在服务端校验角色、资源所有权、状态和version（适用时）；示例是固定契约样例，不表示真实库存、业务运行或测试结果。\n\nDemo已提供该路由；具体已验证范围及未完成分支见docs/demo-v0.1.md。",
        "security": [],
        "x-roles": [
          "GUEST"
        ],
        "x-implementation-status": "IMPLEMENTED_DEMO",
        "x-request-body": "NONE",
        "x-error-codes": {
          "VALIDATION_ERROR": {
            "httpStatus": 400,
            "code": 1001
          },
          "RATE_LIMITED": {
            "httpStatus": 429,
            "code": 1029
          },
          "INTERNAL_ERROR": {
            "httpStatus": 500,
            "code": 1050
          }
        },
        "parameters": [],
        "responses": {
          "200": {
            "description": "成功（Demo路由已提供；验证范围见运行报告）",
            "headers": {
              "X-Trace-Id": {
                "schema": {
                  "type": "string",
                  "description": "对外字符串ID；不将bigint作为JSON数字传输",
                  "example": "trace-demo-001",
                  "minLength": 1,
                  "maxLength": 64,
                  "pattern": "^[A-Za-z0-9_-]+$"
                }
              },
              "Set-Cookie": {
                "description": "设置随机csrf_context HttpOnly/Secure/SameSite=Lax cookie，Path=/api/v1/auth，绑定响应csrfToken，10分钟有效；本地http仅开发可不用Secure。",
                "schema": {
                  "type": "string",
                  "description": "Set-Cookie独立响应头；示例只作格式说明",
                  "example": "csrf_context=opaque-context; Path=/api/v1/auth; HttpOnly; Secure; SameSite=Lax; Max-Age=600"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/CsrfTokenEnvelope"
                },
                "example": {
                  "code": 0,
                  "message": "ok",
                  "data": {
                    "csrfToken": "csrf-demo-token-001",
                    "expiresAt": "2026-10-18T14:00:00+08:00"
                  },
                  "traceId": "trace-demo-001",
                  "timestamp": "2026-10-18T13:00:00+08:00"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "429": {
            "$ref": "#/components/responses/RateLimited"
          },
          "500": {
            "$ref": "#/components/responses/InternalError"
          }
        },
        "x-permissions": [
          "auth.self"
        ],
        "x-permission-mode": "ANY_WITH_ROLE_AND_SCOPE"
      }
    },
