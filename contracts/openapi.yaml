          "minimum": 1,
          "maximum": 100,
          "example": 20,
          "default": 20
        }
      },
      "IdempotencyKey": {
        "name": "Idempotency-Key",
        "in": "header",
        "required": true,
        "description": "主体+路由+键持久化幂等；相同键同请求返回原结果，不同请求体409；建议UUID，保留至少24小时。",
        "schema": {
          "type": "string",
          "description": "客户端每次独立命令生成的唯一键",
          "example": "2be5a476-3c2a-4da5-a198-01c2d7e4f890",
          "format": "uuid"
        }
      },
      "Csrf": {
        "name": "X-CSRF-Token",
        "in": "header",
        "required": true,
        "description": "GET /auth/csrf取得；服务端同时校验绑定cookie、允许Origin及token。",
        "schema": {
          "type": "string",
          "description": "绑定csrf_context cookie的随机token；后续Cookie变更操作通过X-CSRF-Token提交",
          "example": "csrf-demo-token-001",
          "minLength": 16,
          "maxLength": 256
        }
      },
      "Origin": {
        "name": "Origin",
        "in": "header",
        "required": true,
        "description": "浏览器自动发送；仅配置的精确allowlist；非浏览器客户端同样不得略过CSRF。",
        "schema": {
          "type": "string",
          "description": "前端来源",
          "example": "http://localhost:5173",
          "format": "uri"
        }
      },
      "Signature": {
        "name": "X-Sandbox-Signature",
        "in": "header",
        "required": true,
        "description": "小写hex HMAC-SHA256(secret, timestamp + \"\\n\" + nonce + \"\\n\" + 原始请求UTF-8字节)；密钥仅渠道模拟器与后端持有。",
        "schema": {
          "type": "string",
          "description": "HMAC-SHA256 hex",
          "example": "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef",
          "pattern": "^[0-9a-f]{64}$"
        }
      },
      "CallbackTimestamp": {
        "name": "X-Sandbox-Timestamp",
        "in": "header",
        "required": true,
        "description": "渠道签名时间Unix秒，允许服务器时钟±300秒；与body occurredAt分开。",
        "schema": {
          "type": "string",
          "description": "Unix秒字符串",
          "example": "1792303200",
          "pattern": "^[0-9]{10,13}$"
        }
      },
      "CallbackNonce": {
        "name": "X-Sandbox-Nonce",
        "in": "header",
        "required": true,
        "description": "签名随机数；防重放，结合eventId持久化。",
        "schema": {
          "type": "string",
          "description": "对外字符串ID；不将bigint作为JSON数字传输",
          "example": "nonce-demo-001",
          "minLength": 1,
          "maxLength": 64,
          "pattern": "^[A-Za-z0-9_-]+$"
        }
      }
    },
    "responses": {
      "BadRequest": {
