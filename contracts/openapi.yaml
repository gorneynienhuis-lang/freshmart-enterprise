    "/api/v1/admin/pick-tasks/{taskId}/confirm": {
      "post": {
        "operationId": "confirmPickTask",
        "tags": [
          "admin"
        ],
        "summary": "确认实拣数量及称重净差",
        "description": "仅本人已领取拣货任务。请求必须逐allocation明确actualQuantity，包括0；按件不增加原数量，按重允许0至floor(估重×1.1)。实际0或按件少发须reasonCode=SHORTAGE并写说明；正常称重变化使用WEIGHT_VARIANCE。\n\n先显式重分配尝试补齐，仍缺货可部分履约：按件以实际件数×单价，按重以实克×单价/priceUnitGram逐订单行半入取整；实际券减免=min(原固定券分摊,实际行额)，运费保持原快照。全单实际0则CANCELED并退全部已收含运费。\n\n原子释放未实拣预占，只对实际出库量扣onHand并写PICK_OUT；实际0行不写出库流水。实际短缺的物理差异另走隔离/盘点/损耗调整，不能借少发任意改总账。整单净差只建一张补款或退差单；各差额行显式PIECE/GRAM与估/实数量。\n\n补款期限10分钟且不得晚于时段开始。差额NONE/REFUNDED/SETTLED才允许发货；未付补款过期取消整单、退已收款并按实物阶段回库。Idempotency-Key、版本/角色/本人归属均服务端校验。\n\nDemo已提供该路由；具体已验证范围及未完成分支见docs/demo-v0.1.md。",
